; ============================================================
; OPcache Configuration for Production
; ============================================================
; Place this in: /etc/php/8.3/fpm/conf.d/20-opcache.ini
; Or add to your php.ini
; ============================================================

[opcache]
; Enable OPcache
opcache.enable=1

; Memory allocation (64-256MB depending on codebase size)
opcache.memory_consumption=128

; Shared memory size for interned strings
opcache.interned_strings_buffer=16

; Max number of files in the cache
opcache.max_accelerated_files=10000

; Revalidate files every 2 seconds (0 for production with cache:clear on deploy)
opcache.revalidate_freq=2

; Don't check file timestamps (set to 1 for production)
opcache.validate_timestamps=1

; Enable fast shutdown
opcache.fast_shutdown=1

; Enable CLI opcode caching (useful for artisan commands)
opcache.enable_cli=0

; Max file size to cache (bytes) - 0 means unlimited
opcache.max_file_size=0

; Preload classes (optional, requires opcache-preload.php)
; opcache.preload=/path/to/preload.php
; opcache.preload_user=www-data

; Optimization level
; 1 = Pass 1, 2 = Pass 2, 4 = Find after pass 1, 8 = Dump after pass 1
; 255 = All optimizations (recommended)
opcache.optimization_level=255

; Log errors
opcache.log_verbosity=1

; Disable on shutdown
opcache.consistency_checks=0
