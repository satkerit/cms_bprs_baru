; ============================================================
; PHP-FPM Pool Configuration for Production
; ============================================================
; Place this in: /etc/php/8.3/fpm/pool.d/www.conf
; ============================================================

; Pool name
[www]

; Run as
user = www-data
group = www-data

; Socket or TCP
listen = /var/run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ── Process Manager (CRITICAL for concurrency) ──
; 'dynamic' = spawns processes on demand (recommended)
; 'static' = fixed number of processes (best for high traffic)
; 'ondemand' = kills idle processes (best for low traffic)
pm = dynamic

; Max number of child processes
pm.max_children = 50

; Number of processes created on startup
pm.start_servers = 5

; Minimum number of idle server processes
pm.min_spare_servers = 3

; Maximum number of idle server processes
pm.max_spare_servers = 10

; Time before idle process is killed (seconds)
pm.process_idle_timeout = 10s

; Number of requests before process restarts
pm.max_requests = 500

; ── Slow Log ──
slowlog = /var/log/php8.3-fpm-slow.log
request_slowlog_timeout = 5s

; ── PHP Settings ──
php_admin_value[error_log] = /var/log/php8.3-fpm-error.log
php_admin_flag[log_errors] = on
php_value[session.save_handler] = redis
php_value[session.save_path] = "tcp://127.0.0.1:6379"

; ── Environment Variables ──
clear_env = no

; ── Security ──
security.limit_extensions = .php

; ── Status Page ──
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong
