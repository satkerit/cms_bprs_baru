# ============================================================
# NGINX Performance Configuration for Laravel
# ============================================================
# Place this in: /etc/nginx/sites-available/your-site.conf
# Or include it in your existing server block
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    root /var/www/your-site/public;
    index index.php;

    # ── SSL Configuration ──
    ssl_certificate /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # ── Brotli Compression (if module installed) ──
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Static Asset Caching ──
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|woff|woff2|ttf|eot|otf)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Fonts with preloading ──
    location ~* \.(woff2|woff|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # ── Prevent access to hidden files ──
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Laravel Routing ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP Processing (PHP-FPM) ──
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI optimizations
        fastcgi_buffering on;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # Security
        fastcgi_hide_header X-Powered-By;
    }

    # ── Deny access to sensitive files ──
    location ~ \.(env|log|sql|md)$ {
        deny all;
    }

    # ── Deny access to storage except specific paths ──
    location ^~ /storage/app/private {
        deny all;
    }

    # ── Favicon ──
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # ── Robots.txt ──
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # ── Client Body Size ──
    client_max_body_size 20M;

    # ── Keepalive ──
    keepalive_timeout 65;
    tcp_nopush on;
    tcp_nodelay on;

    # ── Open File Cache ──
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 80s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # ── Disable access logs for static files ──
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|avif|svg|woff|woff2|ttf|eot|mp4|ogg)$ {
        access_log off;
        log_not_found off;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
